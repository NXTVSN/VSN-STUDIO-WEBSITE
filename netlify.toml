[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# VSN Leads CRM (installable iPhone app) lives at /crm
[[redirects]]
  from = "/crm"
  to = "/crm/index.html"
  status = 200

[[redirects]]
  from = "/api/crm/*"
  to = "/.netlify/functions/crm-api/:splat"
  status = 200

# SPA fallback so client-side routes like /campaign resolve
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
