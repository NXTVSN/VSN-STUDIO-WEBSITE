[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# VSN Studio — private workspace (installable iPhone app) at /studio
[[redirects]]
  from = "/studio"
  to = "/studio/index.html"
  status = 200

# Legacy CRM path → Studio
[[redirects]]
  from = "/crm/*"
  to = "/studio/"
  status = 301

# Client-facing proposal links: /p/<token>
[[redirects]]
  from = "/p/*"
  to = "/p/index.html"
  status = 200

[[redirects]]
  from = "/api/studio/*"
  to = "/.netlify/functions/studio-api/:splat"
  status = 200

# SPA fallback so client-side routes like /campaign resolve
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
