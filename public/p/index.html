<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Proposal — Studio Visionary</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" href="/studio/icon-192.png" />
  <style>
    :root { --bg:#0a0a0a; --paper:#ffffff; --ink:#0a0a0a; --ink-2:#444; --muted:#7a7a7a; --line:#e6e6e6; --navy:#1a3a6e; --navy-2:#0f2c59; --green:#1f7a4f; --red:#c23b38; }
    * { box-sizing:border-box; }
    html, body { margin:0; }
    body { font-family:"Helvetica Neue", Helvetica, -apple-system, BlinkMacSystemFont, Arial, sans-serif; background:var(--bg); color:#fff; -webkit-font-smoothing:antialiased; line-height:1.5; }
    .eyebrow { font-size:10px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); }
    .hero { padding:56px 24px 40px; max-width:900px; margin:0 auto; }
    .brand { display:flex; align-items:center; gap:14px; margin-bottom:44px; }
    .brand img { width:44px; height:44px; border-radius:11px; }
    .brand .b1 { font-size:11px; font-weight:700; letter-spacing:.24em; text-transform:uppercase; }
    .brand .b2 { font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-top:2px; }
    .hero h1 { font-size:44px; font-weight:300; letter-spacing:-.03em; line-height:1.02; margin:10px 0 14px; }
    .hero .sub { color:#b3b3b3; font-size:15px; max-width:640px; }
    .hero .meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:24px; }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:999px; font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; background:#161616; color:#ccc; border:1px solid rgba(255,255,255,.14); }
    .pill.navy { background:var(--navy-2); border-color:var(--navy); color:#dfe8f7; }
    .pill.green { background:#0c261a; border-color:#1f5c40; color:#8fe0b7; }
    .pill.red { background:#2a1010; border-color:#6a2b2a; color:#f2a19f; }
    .paper { background:var(--paper); color:var(--ink); border-radius:28px 28px 0 0; padding:44px 24px 80px; }
    .doc { max-width:820px; margin:0 auto; }
    .sec { padding:26px 0; border-top:1px solid var(--line); }
    .sec:first-child { border-top:0; padding-top:0; }
    .sec h2 { font-size:11px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); margin:0 0 14px; }
    .sec p { margin:0 0 10px; color:var(--ink-2); font-size:15px; white-space:pre-wrap; }
    .cols { display:grid; grid-template-columns:1fr; gap:22px; }
    @media (min-width:700px) { .cols { grid-template-columns:1fr 1fr; } .paper { padding:56px 40px 100px; } }
    .kv { font-size:14px; color:var(--ink-2); }
    .kv b { display:block; color:var(--ink); font-weight:600; }
    ul.clean { margin:0; padding:0 0 0 18px; color:var(--ink-2); font-size:15px; }
    ul.clean li { margin:4px 0; }
    .phase { display:grid; grid-template-columns:1fr auto; gap:6px 18px; padding:16px 0; border-top:1px solid var(--line); }
    .phase:first-of-type { border-top:0; }
    .phase .n { font-weight:600; font-size:16px; letter-spacing:-.01em; }
    .phase .d { color:var(--ink-2); font-size:14px; grid-column:1; }
    .phase .w { color:var(--muted); font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
    .phase .f { font-variant-numeric:tabular-nums; font-size:16px; text-align:right; white-space:nowrap; }
    .total { display:flex; justify-content:space-between; align-items:baseline; padding:18px 0 0; margin-top:6px; border-top:2px solid var(--ink); }
    .total .t { font-size:11px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; }
    .total .a { font-size:30px; font-weight:300; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
    .accept { margin-top:34px; padding:26px; border-radius:22px; background:#0a0a0a; color:#fff; }
    .accept h3 { margin:0 0 6px; font-weight:300; font-size:24px; letter-spacing:-.02em; }
    .accept p { color:#b3b3b3; font-size:14px; margin:0 0 16px; }
    .accept input { width:100%; background:#141414; border:1px solid rgba(255,255,255,.18); color:#fff; border-radius:12px; padding:13px 14px; font-size:16px; outline:none; margin-bottom:10px; }
    .accept input:focus { border-color:rgba(255,255,255,.45); }
    .row2 { display:grid; grid-template-columns:1fr; gap:10px; }
    @media (min-width:600px) { .row2 { grid-template-columns:1fr 1fr; } }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px 22px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; border:1px solid transparent; cursor:pointer; background:#fff; color:#000; }
    .btn.navy { background:var(--navy); color:#fff; border-color:#24478a; }
    .btn.ghost { background:transparent; color:#fff; border-color:rgba(255,255,255,.25); }
    .btn:disabled { opacity:.5; pointer-events:none; }
    .btnrow { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:6px; }
    .fine { color:#7a7a7a; font-size:12px; margin-top:12px; line-height:1.5; }
    .done { padding:22px 26px; border-radius:22px; background:#eef8f2; border:1px solid #bfe3cf; color:#0f4d30; margin-top:30px; }
    .done h3 { margin:0 0 4px; font-weight:500; font-size:20px; }
    .foot { text-align:center; color:var(--muted); font-size:12px; margin-top:50px; letter-spacing:.04em; }
    .topbar { position:sticky; top:0; z-index:5; display:flex; justify-content:flex-end; gap:8px; padding:12px 16px; background:rgba(10,10,10,.8); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
    .topbar .btn { padding:9px 14px; font-size:10px; }
    .err { max-width:600px; margin:120px auto; text-align:center; padding:0 24px; color:#b3b3b3; }
    .err h1 { font-weight:300; font-size:30px; color:#fff; letter-spacing:-.02em; }
    .preview-note { background:#2a1e08; color:#f0c274; text-align:center; font-size:12px; letter-spacing:.06em; padding:8px; }
    @media print {
      body { background:#fff; color:#000; }
      .topbar, .accept, .preview-note, .noprint { display:none !important; }
      .hero { padding:0 0 20px; color:#000; }
      .hero .sub { color:#333; }
      .hero h1 { font-size:34px; }
      .brand .b2, .eyebrow { color:#666; }
      .pill { border-color:#bbb; color:#333; background:#f2f2f2; }
      .paper { border-radius:0; padding:0; }
      .sec { break-inside:avoid; }
      a { color:inherit; text-decoration:none; }
      @page { margin:18mm; }
    }
  </style>
</head>
<body>
  <div id="root"><div class="err"><h1>Loading proposal…</h1></div></div>
  <script>
    (async () => {
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const money = (n) => (Number(n) || 0).toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
      const fmtDate = (ymd) => (ymd ? new Date(ymd.length > 10 ? ymd : ymd + "T12:00:00").toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" }) : "");
      const token = location.pathname.split("/").filter(Boolean)[1] || "";
      const params = new URLSearchParams(location.search);
      const ownerTok = params.get("preview") ? localStorage.getItem("vsn_studio_token") : null;
      const root = document.getElementById("root");
      const fail = (msg) => (root.innerHTML = `<div class="err"><h1>${esc(msg || "This proposal link is not available.")}</h1><p>If you believe this is a mistake, please contact the studio.</p></div>`);
      if (!token) return fail();
      let data;
      try {
        const r = await fetch(`/api/studio/public/proposal/${encodeURIComponent(token)}`, { headers: ownerTok ? { authorization: "Bearer " + ownerTok } : {} });
        data = await r.json(); if (!r.ok) return fail(data.error);
      } catch { return fail("Could not load the proposal. Please try again."); }

      function render(d) {
        const p = d.proposal, s = d.studio, c = p.client || {};
        const statusPill = p.status === "accepted" ? `<span class="pill green">Accepted ${fmtDate(p.accepted_at)}</span>` : p.status === "declined" ? `<span class="pill red">Declined</span>` : p.status === "expired" ? `<span class="pill red">Expired</span>` : `<span class="pill navy">Valid until ${fmtDate(p.valid_until)}</span>`;
        document.title = `Proposal ${p.number} — ${s.name}`;
        root.innerHTML = `
          ${d.preview ? `<div class="preview-note">PREVIEW — this is how your client sees it${p.status === "draft" ? " (draft: link is not live until you mark it sent)" : ""}</div>` : ""}
          <div class="topbar noprint"><button class="btn ghost" onclick="window.print()">Save as PDF</button>${p.status !== "accepted" && p.status !== "declined" && p.status !== "expired" ? `<a class="btn" href="#accept">Accept proposal</a>` : ""}</div>
          <header class="hero">
            <div class="brand"><img src="/studio/icon-192.png" alt="" /><div><div class="b1">${esc(s.name)}</div><div class="b2">Architecture · Design · Visualization</div></div></div>
            <div class="eyebrow">Proposal ${esc(p.number)} · ${fmtDate(p.sent_at || p.created_at)}</div>
            <h1>${esc(p.title)}</h1>
            <div class="sub">Prepared for <b style="color:#fff">${esc(c.name || "")}</b>${c.company ? `, ${esc(c.company)}` : ""}${p.project_address ? ` · ${esc(p.project_address)}` : ""}</div>
            <div class="meta">${statusPill}<span class="pill">Total ${money(p.total)}</span></div>
          </header>
          <main class="paper"><div class="doc">
            <div class="sec"><div class="cols">
              <div class="kv"><b>Prepared for</b>${esc(c.name || "")}${c.company ? `<br/>${esc(c.company)}` : ""}${c.address ? `<br/>${esc(c.address)}` : ""}${c.email ? `<br/>${esc(c.email)}` : ""}${c.phone ? `<br/>${esc(c.phone)}` : ""}</div>
              <div class="kv"><b>Prepared by</b>${esc(s.owner || "")}<br/>${esc(s.name || "")}${s.address ? `<br/>${esc(s.address)}` : ""}${s.email ? `<br/>${esc(s.email)}` : ""}${s.phone ? `<br/>${esc(s.phone)}` : ""}${s.website ? `<br/>${esc(s.website)}` : ""}</div>
            </div></div>
            ${p.intro ? `<div class="sec"><h2>Introduction</h2><p>${esc(p.intro)}</p></div>` : ""}
            ${p.project_summary ? `<div class="sec"><h2>Project</h2><p>${esc(p.project_summary)}</p></div>` : ""}
            ${(p.scope || []).length ? `<div class="sec"><h2>Scope of services</h2><ul class="clean">${p.scope.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
            <div class="sec"><h2>Phases & fees</h2>
              ${(p.phases || []).map((ph, i) => `<div class="phase"><div class="n">${String(i + 1).padStart(2, "0")} · ${esc(ph.name)}</div><div class="f">${ph.fee ? money(ph.fee) : "—"}</div>${ph.desc ? `<div class="d">${esc(ph.desc)}</div>` : ""}${ph.weeks ? `<div class="w">${esc(ph.weeks)}</div>` : ""}</div>`).join("")}
              <div class="total"><span class="t">Total professional fee</span><span class="a">${money(p.total)}</span></div>
            </div>
            ${(p.deliverables || []).length ? `<div class="sec"><h2>Deliverables</h2><ul class="clean">${p.deliverables.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
            ${p.exclusions ? `<div class="sec"><h2>Not included</h2><p>${esc(p.exclusions)}</p></div>` : ""}
            ${p.terms ? `<div class="sec"><h2>Terms</h2><p>${esc(p.terms)}</p></div>` : ""}
            <div id="accept">${acceptBlock(p, s)}</div>
            <div class="foot">${esc(s.name)}${s.website ? ` · ${esc(s.website)}` : ""} · Proposal ${esc(p.number)}</div>
          </div></main>`;
        wire(p);
      }
      function acceptBlock(p, s) {
        if (p.status === "accepted") return `<div class="done"><h3>Accepted — thank you${p.accepted_by?.name ? `, ${esc(p.accepted_by.name.split(" ")[0])}` : ""}.</h3>Signed ${fmtDate(p.accepted_at)}${p.accepted_by?.name ? ` by ${esc(p.accepted_by.name)}` : ""}. ${esc(s.owner || "We")} will be in touch shortly with next steps and the retainer invoice. Use “Save as PDF” above to keep a copy.</div>`;
        if (p.status === "declined") return `<div class="done" style="background:#f6f6f6;border-color:#ddd;color:#444"><h3>Proposal declined.</h3>Thank you for letting us know. If circumstances change, we'd be glad to revisit.</div>`;
        if (p.status === "expired") return `<div class="done" style="background:#fff4f4;border-color:#f0c9c8;color:#7a2a28"><h3>This proposal has expired.</h3>Please contact ${esc(s.name)} for an updated proposal.</div>`;
        return `<div class="accept noprint"><h3>Ready to move forward?</h3><p>Type your full name to accept this proposal. Acceptance is recorded with a timestamp and confirms the scope, phases and fees above.</p>
          <div class="row2"><input id="acName" placeholder="Full name" autocomplete="name" /><input id="acEmail" type="email" placeholder="Email (for your copy)" autocomplete="email" /></div>
          <div class="btnrow"><button class="btn" id="acBtn">Accept proposal ↗</button><button class="btn ghost" id="dcBtn">Decline</button><span id="acErr" style="color:#f2a19f;font-size:13px"></span></div>
          <div class="fine">Questions first? ${s.email ? `Email <a href="mailto:${esc(s.email)}" style="color:#fff">${esc(s.email)}</a>` : "Reach out to the studio"}${s.phone ? ` or call ${esc(s.phone)}` : ""}.</div></div>`;
      }
      function wire(p) {
        const ac = document.getElementById("acBtn"); if (!ac) return;
        ac.onclick = async () => {
          const name = document.getElementById("acName").value.trim(); const err = document.getElementById("acErr");
          if (!name) { err.textContent = "Please type your full name."; return; }
          ac.disabled = true; err.textContent = "";
          try { const r = await fetch(`/api/studio/public/proposal/${encodeURIComponent(token)}/accept`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name, email: document.getElementById("acEmail").value.trim() }) }); const d = await r.json(); if (!r.ok) throw new Error(d.error); render(d); document.getElementById("accept").scrollIntoView({ behavior: "smooth" }); }
          catch (e) { err.textContent = e.message; ac.disabled = false; }
        };
        document.getElementById("dcBtn").onclick = async () => {
          const reason = prompt("Optional — let us know why, so we can do better:") ;
          if (reason === null) return;
          try { const r = await fetch(`/api/studio/public/proposal/${encodeURIComponent(token)}/decline`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ reason }) }); const d = await r.json(); if (!r.ok) throw new Error(d.error); render(d); } catch (e) { alert(e.message); }
        };
      }
      render(data);
      if (params.get("print")) setTimeout(() => window.print(), 600);
    })();
  </script>
</body>
</html>
